; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:program_via_ArduinoISP]
platform = atmelavr
board = ATmega328P
build_flags =
  -Ilib/ssd1306

board_build.mcu = atmega328p
board_build.f_cpu = 8000000L

upload_protocol = custom
upload_port = /dev/ttyUSB1

upload_command = ~/.platformio/packages/tool-avrdude/avrdude -C ~/.platformio/packages/tool-avrdude/avrdude.conf -p atmega328p -P /dev/ttyUSB1 -b 19200 -c stk500v1 -U flash:w:.pio/build/program_via_ArduinoISP/firmware.hex:i
